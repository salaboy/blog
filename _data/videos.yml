# Conference talks, keynotes, workshops and webinars, newest first.
#
# Each entry is one event; `talks` holds the sessions recorded at it. The page
# at /videos/ renders `conference`, `location` and `date` as the separator above
# each group, so an event with several sessions is listed once.
#
# `id` is the YouTube video id. `start` (optional, seconds) deep-links into a
# full-day stream. `with` (optional) lists co-speakers. `slides` (optional) is
# the speakerdeck.com/salaboy slug for that talk's deck.
#
# A talk with no `id` had no recording published: give it `deck` (the Speaker
# Deck player id, the hex string in its embed URL) and the deck is shown in the
# player's place.

